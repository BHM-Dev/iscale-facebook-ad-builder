# Facebook Ad Builder - Docker Compose
# Run: docker compose up --build
# App: http://localhost:5173  |  API: http://localhost:8000

services:
  postgres:
    image: postgres:15-alpine
    container_name: ad-builder-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-facebook_ad_builder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-facebook_ad_builder}"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ad-builder-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-facebook_ad_builder}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.adbuilder-api.rule=Host(`adbuilder-api.velocitymx.io`)"
      - "traefik.http.routers.adbuilder-api.entrypoints=websecure"
      - "traefik.http.routers.adbuilder-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.adbuilder-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.adbuilder-api-http.rule=Host(`adbuilder-api.velocitymx.io`)"
      - "traefik.http.routers.adbuilder-api-http.entrypoints=web"
      - "traefik.http.routers.adbuilder-api-http.middlewares=redirect-to-https@docker"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: ad-builder-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.adbuilder.rule=Host(`adbuilder.velocitymx.io`)"
      - "traefik.http.routers.adbuilder.entrypoints=websecure"
      - "traefik.http.routers.adbuilder.tls.certresolver=letsencrypt"
      - "traefik.http.services.adbuilder.loadbalancer.server.port=80"
      - "traefik.http.routers.adbuilder-http.rule=Host(`adbuilder.velocitymx.io`)"
      - "traefik.http.routers.adbuilder-http.entrypoints=web"
      - "traefik.http.routers.adbuilder-http.middlewares=redirect-to-https@docker"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

volumes:
  postgres_data:
  backend_uploads:

networks:
  traefik-proxy:
    external: true
