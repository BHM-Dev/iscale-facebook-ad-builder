# Facebook Ad Builder - Docker Compose
# Run: docker compose up --build
# App: http://localhost:5173  |  API: http://localhost:8000

services:
  postgres:
    image: postgres:15-alpine
    container_name: ad-builder-db
    mem_limit: 1g   # 4GB VPS; caps a runaway so it can't starve the others (peaks 2026-11-15: api ~410MB, db 136MB, web 5MB)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-facebook_ad_builder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-facebook_ad_builder}"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - proxy


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ad-builder-api
    mem_limit: 2g   # 4GB VPS; caps a runaway so it can't starve the others (peaks 2026-11-15: api ~410MB, db 136MB, web 5MB)
    restart: unless-stopped
    # uvicorn drains requests (10s) then the scheduler finishes running jobs (25s) — see backend/Dockerfile.
    stop_grace_period: 40s
    # tini as PID 1 reaps orphaned Playwright/Chromium children now that uvicorn is exec'd.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-facebook_ad_builder}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`adbuilder-api.velocitymx.io`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend-http.rule=Host(`adbuilder-api.velocitymx.io`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=redirect-https"
      - "traefik.http.routers.backend-http.service=backend"
      # Same middleware, declared here too so the API redirect doesn't depend on the frontend container.
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
    networks:
      - proxy


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        # Same GIT_COMMIT the deploy script exports for the backend service
        # below — reused here purely to bust the frontend build cache on
        # every deploy. See frontend/Dockerfile for why.
        CACHE_BUST: ${GIT_COMMIT:-unknown}
    container_name: ad-builder-web
    mem_limit: 256m   # 4GB VPS; caps a runaway so it can't starve the others (peaks 2026-11-15: api ~410MB, db 136MB, web 5MB)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`adbuilder.velocitymx.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # HTTP -> HTTPS. Its own router: the old labels re-declared `frontend.entrypoints` three times
      # (last one wins = websecure), so plain http:// had no router at all and answered 404.
      - "traefik.http.routers.frontend-http.rule=Host(`adbuilder.velocitymx.io`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=redirect-https"
      - "traefik.http.routers.frontend-http.service=frontend"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
    networks:
      - proxy


volumes:
  postgres_data:
  backend_uploads:

networks:
  proxy:
    external: true
    name: traefik-proxy
