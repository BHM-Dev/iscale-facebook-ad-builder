# Read-only diagnostic workflow — manually triggered only (workflow_dispatch),
# never runs on push. Reuses the same SSH secrets deploy.yml already has to
# inspect what's actually running on the VPS, without any new credentials.
#
# Every command below is read-only: no docker rm/stop/restart, no file edits,
# no compose up/down. Safe to run any time. Round 2 (2026-08-16): container is
# confirmed fresh (created at the last deploy, no duplicates/orphans) yet still
# serves byte-identical content to a build from 2026-08-09 — so this round
# checks INSIDE the running container/image for a bind-mount override or a
# build that silently didn't run.
name: Diagnose Frontend Deploy

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS container/image internals (read-only)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "===== any bind mounts on ad-builder-web (would override built assets) ====="
            docker inspect ad-builder-web --format '{{json .Mounts}}' | python3 -m json.tool

            echo ""
            echo "===== file actually served, seen FROM INSIDE the running container ====="
            docker exec ad-builder-web ls -la /usr/share/nginx/html/assets/ | head -20
            echo "--- md5 + first 200 bytes of the JS bundle inside the container ---"
            docker exec ad-builder-web sh -c "md5sum /usr/share/nginx/html/assets/*.js; head -c 200 /usr/share/nginx/html/assets/index-*.js"

            echo ""
            echo "===== does the bundle inside the container contain the new code? ====="
            docker exec ad-builder-web sh -c "grep -c 'papaparse\|Bulk Match\|ad_number' /usr/share/nginx/html/assets/*.js || echo 'ZERO MATCHES INSIDE CONTAINER'"

            echo ""
            echo "===== image build history (layer timestamps + sizes) ====="
            docker history --no-trunc iscale-facebook-ad-builder-frontend 2>&1 | head -30

            echo ""
            echo "===== does the SOURCE FILE on disk (outside any container) contain the new code? ====="
            cd /home/ubuntu/iscale-facebook-ad-builder
            grep -c "papaparse" frontend/package.json || echo "papaparse NOT in package.json on disk"
            ls -la frontend/src/components/ | grep -i bulk || echo "BulkMatchImport.jsx NOT found on disk"
            grep -c "CACHE_BUST" frontend/Dockerfile || echo "CACHE_BUST NOT in Dockerfile on disk"

            echo ""
            echo "===== is there a second docker-compose file that might take precedence? ====="
            ls -la /home/ubuntu/iscale-facebook-ad-builder/docker-compose*.yml
            find /home/ubuntu -maxdepth 3 -iname "docker-compose*.yml" 2>/dev/null

            echo ""
            echo "===== is /home/ubuntu/iscale-facebook-ad-builder the only checkout, or are there others? ====="
            find /home/ubuntu / -maxdepth 4 -iname "iscale-facebook-ad-builder" -type d 2>/dev/null

            echo ""
            echo "===== DONE — no state was changed by this workflow ====="
