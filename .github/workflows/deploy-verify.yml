name: Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches: [develop]

jobs:
  backend-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed backend version
        run: |
          URL="${{ vars.BACKEND_URL || 'https://adbuilder-api.velocitymx.io' }}"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Checking backend version at $URL..."
          for i in $(seq 1 20); do
            BODY=$(curl -fsS "$URL/api/v1/version" || true)
            COMMIT=$(BODY="$BODY" python3 -c 'import json, os; print(json.loads(os.environ["BODY"]).get("commit", ""))' 2>/dev/null || true)
            if [ "$COMMIT" = "$EXPECTED_SHA" ]; then
              echo "Backend is running expected commit $COMMIT"
              exit 0
            fi
            echo "Attempt $i: commit '${COMMIT:-unavailable}' (expected $EXPECTED_SHA) - retrying in 10s..."
            sleep 10
          done
          echo "::error::Backend did not report expected commit $EXPECTED_SHA"
          exit 1

  e2e-smoke-tests:
    needs: backend-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: Run smoke tests
        working-directory: frontend
        run: bash tests/agent-browser/run-all.sh
        env:
          CI: true
          BASE_URL: ${{ vars.FRONTEND_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

  notify-failure:
    needs: [backend-version, e2e-smoke-tests]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: |
          echo "::error::Post-deploy verification FAILED! Check the workflow logs."
